<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龙虎榜数据 - 期货龙虎榜数据中心</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <h1>期货龙虎榜数据中心</h1>

  <nav class="nav">
    <a href="index.html">首页</a>
    <a href="ranking.html">龙虎榜数据</a>
    <a href="download.html">历史数据下载</a>
    <a href="#">品种中心</a>
  </nav>
</header>

<main class="container">

  <section class="card">
    <h2>龙虎榜数据</h2>
    <p>当前已接入不锈钢真实龙虎榜测试数据。</p>
  </section>

  <section class="card">
    <h2>查询条件</h2>

    <p>
      日期：
      <input type="date" value="2026-08-19">
    </p>

    <p>
      品种：
      <select>
        <option>不锈钢 SS</option>
      </select>
    </p>

    <p>
      合约：
      <select id="contractSelect"></select>
    </p>
  </section>

  <section class="card">
    <h2>合约龙虎榜</h2>

    <table>
      <thead>
        <tr>
          <th>公司（多）</th>
          <th>净多头</th>
          <th>净多增减</th>

          <th>公司（空）</th>
          <th>净空头</th>
          <th>净空增减</th>
        </tr>
      </thead>

      <tbody id="rankingBody"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>持仓总榜 - 多头</h2>

    <table>
      <thead>
        <tr>
          <th>排名</th>
          <th>公司</th>
          <th>净多头</th>
          <th>净增减</th>
        </tr>
      </thead>

      <tbody id="totalLongBody"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>持仓总榜 - 空头</h2>

    <table>
      <thead>
        <tr>
          <th>排名</th>
          <th>公司</th>
          <th>净空头</th>
          <th>净增减</th>
        </tr>
      </thead>

      <tbody id="totalShortBody"></tbody>
    </table>
  </section>

</main>

<script src="app.js"></script>

</body>
</html>
